<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>DSH Remote</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="mark" src="icons/icon-192.png" alt="" width="44" height="44" />
      <h1>DSH Remote</h1>
      <p class="lede">远程连接 DeepSeek Harness</p>
    </header>

    <section class="view" id="form-view">
      <form id="connect-form" autocomplete="off">
        <label for="host">当前服务器</label>
        <div class="host" id="host" title="当前服务器地址"></div>
        <button type="submit" id="go" class="primary">连接</button>
        <p class="hint">连接后进入 DeepSeek Harness 工作台</p>
        <p class="error" id="error" hidden>无法连接服务器，请检查网络后重试</p>
      </form>
    </section>

    <section class="view" id="connecting-view" hidden>
      <p class="status">正在连接</p>
      <div class="progress" aria-hidden="true"><span></span></div>
    </section>

    <footer class="foot">DSH Remote · v0.1.0</footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
